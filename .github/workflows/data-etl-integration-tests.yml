name: Data ETL Integration Tests

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: data-etl/requirements-dev.txt
      - run: pip install -r data-etl/requirements-dev.txt
      - run: pytest data-etl/tests/unit/ data-etl/tests/integration/ -v
        env:
          APCA-API-KEY-ID: ${{ secrets.ALPACA_API_KEY }}
          APCA-API-SECRET-KEY: ${{ secrets.ALPACA_SECRET_KEY }}
